name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install taxus
        run: cargo install --git https://codeberg.org/crustyrustacean/taxus.git taxus

      - name: Build site
        run: taxus build

      - name: Create Cloudflare Pages project (idempotent)
        run: npx wrangler pages project create crusty-metallian-net --production-branch trunk || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/ --project-name=crusty-metallian-net --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
