[application]
port = 8000
host = "0.0.0.0"
static_dir = "static"
templates_glob = "templates/**/*.html"

[metadata]
musicbrainz_base_url = "https://musicbrainz.org/ws/2"
cover_art_base_url = "https://coverartarchive.org"

[admin]
username = "test"
password = "test"

[database]
path = "crusty-metallian.db"
max_connections = 5

[storage]
backend = "memory"
fs_root = ""
r2_bucket = ""
r2_endpoint = ""
r2_access_key = ""
r2_secret_key = ""

[healing]
enabled = true
interval_secs = 900
max_attempts = 3
per_pass = 3

[cors]
allowed_origins = [
    "https://crusty-metallian.net",
    "https://www.crusty-metallian.net",
]
