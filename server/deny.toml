[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0594", reason = "actix-session 0.11 depends on cookie 0.16; this Actix Web server never calls fork() without exec(), so it is not affected" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "heic"
allow = ["AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
