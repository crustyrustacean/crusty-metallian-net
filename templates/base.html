<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A heavy metal oriented music blog.">

        <!-- Open Graph -->
        <meta property="og:title" content="Crusty Metallian">
        <meta property="og:description" content="A heavy metal oriented music blog.">
        <meta property="og:url" content="https://crusty-metallian.net">
        <meta property="og:type" content="website">

        <!-- Twitter/X -->
        <meta name="twitter:card" content="summary_large_image">

        <meta name="theme-color" content="#1a1a2e">
        <link rel="canonical" href="https://crusty-metallian.net">
        <link rel="icon" type="image/png" href="/static/favicon.png">
        <link rel="stylesheet" href="/css/main.css">
        <title>{{ site.name }} | {% block title %}{% endblock %}</title>

        <!-- Privacy-friendly analytics by Plausible -->
        <script async src="https://plausible.io/js/pa-eVi0KgioIXUpLr6lLaBU3.js"></script>
        <script>
            window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
            plausible.init()
        </script>

    </head>
<body>
    <!-- header section -->
    {% include "partials/header.html" %}

    <!-- content section -->
    <main id="main">
        {% block content %}{% endblock %}
    </main>

    <!-- footer section -->
    {% include "partials/footer.html" %}

    <!-- General interactivity via plain JavaScript -->
    <script src="/static/scripts.js"></script>
</body>
</html>
